[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-hop-retrieval-router"
version = "0.1.0"
description = "Iterative query decomposition and multi-hop retrieval planner with dynamic termination condition checking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
multi-hop-retrieval-router = "multi_hop_retrieval_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multi_hop_retrieval_router*"]
